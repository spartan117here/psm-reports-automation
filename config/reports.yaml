# ==============================================================================
# Report Configurations (Generic Adapter Architecture)
# Both Subhiksham and Viruksham share the same schema & pipeline adapter.
# ==============================================================================

reports:
  subhiksham:
    report_id: "subhiksham"
    display_name: "Scheme New Memberlist - New Swarna Subhiksham"
    endpoint_key: "scheme_new_cust_rep"
    innervex_action: "FindSchemeTransactionReport"
    scheme_name: "NEW SWARNA SUBHIKSHAM"
    # Confirmed 4 sub-schemes from Innervex GetSubSchName
    subschemes:
      - "NEW SWARNA SUBHIKSHAM"
      - "SWARNALAKSHMI JEWELLERY PURCHASE PLAN W"
      - "SWARNA SUBHIKSHAM FLEXI"
      - "SWARNA LABHAM SUPER FLEXI"
    # Showroom filter: 31 showrooms (references mappings.yaml showroom list or 'ALL')
    showroom_mode: "ALL_31"
    emp_code_filter: "All"
    promo_code_filter: "All"
    export_mode: "EXPORT"
    preamble_rows: 3
    raw_expected_column_count: 21
    # 11 Cleaned Output Columns in required business order
    output_columns:
      - "COSTNAME"
      - "CLIENTID"
      - "GROUPCODE"
      - "MSNO"
      - "NAME"
      - "SCHDATE"
      - "RECAMOUNT"
      - "MOBILENO"
      - "SCHEME"
      - "COMMNAME"
      - "COMMCODE"
    # Discarded columns explicitly tracked for validation audit
    discard_columns:
      - "SNO"
      - "DATEOFBIRTH"
      - "ADDRESS"
      - "PHONE"
      - "EMPNAME"
      - "EMPCODE"
      - "IS TELECALLER"
      - "IS HM"
      - "PROMOCODE"
      - "BRANCHNAME"
    # Target Google Sheet monthly tab prefix (e.g. SS - Oct)
    target_sheet_tab_prefix: "SS"
    deduplication_key: "MSNO"

  viruksham:
    report_id: "viruksham"
    display_name: "Scheme New Memberlist - Swarna Viruksham"
    endpoint_key: "scheme_new_cust_rep"
    innervex_action: "FindSchemeTransactionReport"
    scheme_name: "SWARNA VIRUKSHAM"
    # Confirmed 2 sub-schemes from Innervex GetSubSchName
    subschemes:
      - "SWARNA VIRUKSHAM"
      - "SWARNA VIRUKSHAM FLEXI"
    showroom_mode: "ALL_31"
    emp_code_filter: "All"
    promo_code_filter: "All"
    export_mode: "EXPORT"
    preamble_rows: 3
    raw_expected_column_count: 21
    output_columns:
      - "COSTNAME"
      - "CLIENTID"
      - "GROUPCODE"
      - "MSNO"
      - "NAME"
      - "SCHDATE"
      - "RECAMOUNT"
      - "MOBILENO"
      - "SCHEME"
      - "COMMNAME"
      - "COMMCODE"
    discard_columns:
      - "SNO"
      - "DATEOFBIRTH"
      - "ADDRESS"
      - "PHONE"
      - "EMPNAME"
      - "EMPCODE"
      - "IS TELECALLER"
      - "IS HM"
      - "PROMOCODE"
      - "BRANCHNAME"
    # Target Google Sheet monthly tab prefix (e.g. SV - Oct)
    target_sheet_tab_prefix: "SV"
    deduplication_key: "MSNO"

  closing:
    report_id: "closing"
    display_name: "Scheme Closing Report"
    endpoint_key: "scheme_closing_rep"
    innervex_action: "loadData"
    scheme_name: "ALL_ACTIVE"
    showroom_mode: "ALL_32"
    emp_code_filter: "All"
    promo_code_filter: "All"
    export_mode: "EXPORT"
    preamble_rows: 3
    raw_expected_column_count: 15
    output_columns:
      - "DOCDATE"
      - "NAME"
      - "MOBILE"
      - "SCHEMENAME"
      - "WEIGHT"
      - "STATUS"
      - "SHOWROOM"
    discard_columns:
      - "SNO"
      - "REDEMNO"
      - "PASSBOOK"
      - "PURCHASEWEIGHT"
      - "SCHEME AMOUNT"
      - "DEDUCTION AMOUNT"
      - "NET AMOUNT"
      - "PAID INS"
    target_sheet_tab_prefix: "October - 2026"
    deduplication_key: "REDEMNO"

# ==============================================================================
# Screenshot Generation Configurations
# ==============================================================================
screenshots:
  output_dir: "data/screenshots"
  dpi: 200
  padding: 20
  targets:
    enrollment:
      target_id: "enrollment"
      display_name: "Enrollment Report (Consolidated & Achieved Count)"
      workbook_env_key: "GOOGLE_SHEET_NEW_ENROLLMENT_ID"
      workbook_name: "New Enrollment from April 2026"
      worksheet_name: "Consolidate Report - Oct"
      candidate_range: "E3:M31"
      validated_range: "E3:L30"
      title_pattern: "New Enrollment as on"
      filename_prefix: "enrollment_report"
    closing:
      target_id: "closing"
      display_name: "Closing Report (Scheme Rejoining Summary)"
      workbook_env_key: "GOOGLE_SHEET_CLOSED_REJOINING_ID"
      workbook_name: "Closed Member & Rejoining Report"
      worksheet_name: "October - 2026"
      candidate_range: "K2:P12"
      validated_range: "L3:Q14"
      title_pattern: "SCHEME REJOINING REPORT AS ON"
      filename_prefix: "closing_rejoining_report"

