# ==============================================================================
# Pothys Swarna Mahal Daily Reporting Automation - Application Configuration
# ==============================================================================

app:
  name: "pothys-reporting-automation"
  version: "0.1.0"
  timezone: "Asia/Kolkata"
  environment: "development"  # development, staging, production

storage:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  logs_dir: "logs"
  temp_dir: "tmp"

execution:
  default_date_rule: "yesterday"  # yesterday or YYYY-MM-DD
  idempotency_enabled: true
  allow_partial_runs: false
  max_retries: 3
  retry_backoff_seconds: 5

validation_policy:
  halt_on_critical_failure: true
  on_unresolved_employee_code: "FLAG_AND_CONTINUE"  # Options: FLAG_AND_CONTINUE, STRICT_HALT
  on_duplicate_records: "FLAG_AND_DEDUPLICATE"      # Options: FLAG_AND_DEDUPLICATE, STRICT_HALT

security:
  redact_sensitive_logs: true
  sensitive_keys:
    - "password"
    - "passwd"
    - "secret"
    - "token"
    - "session_id"
    - "jsessionid"
    - "cookie"
    - "authorization"
    - "auth"

whatsapp:
  enabled: false  # STRICTLY DISABLED by default. Requires executive authorization.
  api_provider: "meta_cloud_api"
  dry_run: true   # Safe simulation mode (zero external requests)
  rate_limit_per_minute: 20
  recipient: ""   # Single configured recipient phone number (e.g. "+919840123456")
  phone_number_id: ""  # Meta WhatsApp Cloud API Phone Number ID
  api_version: "v21.0"
  delivery_mode: "template"  # "template" (Meta business-initiated) or "session" (free-form media in 24h window)
  template_enrollment_name: "psm_enrollment_report"  # Template for Enrollment Report image
  template_closing_name: "psm_closing_report"        # Template for Closing Report image
  template_language: "en_US"
  timeout_seconds: 30
  history_file: "data/delivery/delivery_history.json"


